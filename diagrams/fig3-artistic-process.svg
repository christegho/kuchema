<rect x="70" y="585" width="1280" height="150" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1"/>
<text x="86" y="610" font-size="15" font-weight="bold">IV · Machine collage-making</text>
<text x="1334" y="610" font-size="13" font-style="italic" fill="#444" text-anchor="end">AI system</text>
<rect x="159.7" y="625.0" width="274.0" height="92.0" rx="0" fill="#e4e4e4" stroke="#111" stroke-width="1.4"/>
<text x="296.7" y="650.0" text-anchor="middle" font-size="13" font-weight="bold">Reading and composing</text>
<text x="296.7" y="667.0" text-anchor="middle" font-size="13">gathers cited context, studies the</text>
<text x="296.7" y="684.0" text-anchor="middle" font-size="13">archive and one of the artist&#x27;s</text>
<text x="296.7" y="701.0" text-anchor="middle" font-size="13">collages, plans every fragment</text>
<rect x="587.0" y="625.0" width="246.0" height="92.0" rx="0" fill="#e4e4e4" stroke="#111" stroke-width="1.4"/>
<text x="710.0" y="650.0" text-anchor="middle" font-size="13" font-weight="bold">Making and cutting</text>
<text x="710.0" y="667.0" text-anchor="middle" font-size="13">generates new water and land</text>
<text x="710.0" y="684.0" text-anchor="middle" font-size="13">material, locates and cuts out</text>
<text x="710.0" y="701.0" text-anchor="middle" font-size="13">each fragment</text>
<rect x="989.8" y="625.0" width="267.0" height="92.0" rx="0" fill="#e4e4e4" stroke="#111" stroke-width="1.4"/>
<text x="1123.3" y="650.0" text-anchor="middle" font-size="13" font-weight="bold">Arranging and stepping back</text>
<text x="1123.3" y="667.0" text-anchor="middle" font-size="13">layers fragments on a water and</text>
<text x="1123.3" y="684.0" text-anchor="middle" font-size="13">earth ground, critiques the draft</text>
<text x="1123.3" y="701.0" text-anchor="middle" font-size="13">and revises it</text>
