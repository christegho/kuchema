<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="1109" viewBox="0 0 1420 1109" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#000"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="1420" height="1109" fill="#ffffff"/><rect x="70" y="20" width="1280" height="133" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1"/>
<text x="86" y="45" font-size="15" font-weight="bold">I · Situated research</text>
<text x="1334" y="45" font-size="13" font-style="italic" fill="#444" text-anchor="end">community contributors and the lead artist</text>
<rect x="169.2" y="60.0" width="255.0" height="75.0" rx="24" fill="#ffffff" stroke="#111" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="296.7" y="85.0" text-anchor="middle" font-size="13" font-weight="bold">Community knowledge holders</text>
<text x="296.7" y="102.0" text-anchor="middle" font-size="13">oral histories, water places,</text>
<text x="296.7" y="119.0" text-anchor="middle" font-size="13">ecological practice</text>
<rect x="600.0" y="60.0" width="220.0" height="75.0" rx="24" fill="#ffffff" stroke="#111" stroke-width="1.2" stroke-dasharray="2 3"/>
<text x="710.0" y="93.5" text-anchor="middle" font-size="13" font-weight="bold">Youth participants</text>
<text x="710.0" y="110.5" text-anchor="middle" font-size="13">climate-futures workshop</text>
<rect x="979.3" y="60.0" width="288.0" height="75.0" rx="6" fill="#ffffff" stroke="#000" stroke-width="2.4"/>
<text x="1123.3" y="85.0" text-anchor="middle" font-size="13" font-weight="bold">Prior research</text>
<text x="1123.3" y="102.0" text-anchor="middle" font-size="13">how mainstream generative AI</text>
<text x="1123.3" y="119.0" text-anchor="middle" font-size="13">flattens culturally specific futures</text>
<path d="M710.0,153.0 L710.0,195.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="70" y="197" width="1280" height="150" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1"/>
<text x="86" y="222" font-size="15" font-weight="bold">II · Curation and authorship</text>
<text x="1334" y="222" font-size="13" font-style="italic" fill="#444" text-anchor="end">lead artist</text>
<rect x="111.5" y="237.0" width="267.0" height="92.0" rx="6" fill="#ffffff" stroke="#000" stroke-width="2.4"/>
<text x="245.0" y="270.5" text-anchor="middle" font-size="13" font-weight="bold">Photographic archive</text>
<text x="245.0" y="287.5" text-anchor="middle" font-size="13">people · water places · landscape</text>
<text x="245.0" y="304.5" text-anchor="middle" font-size="13">the artist&#x27;s collages</text>
<rect x="439.0" y="237.0" width="232.0" height="92.0" rx="6" fill="#ffffff" stroke="#000" stroke-width="2.4"/>
<text x="555.0" y="262.0" text-anchor="middle" font-size="13" font-weight="bold">Texts</text>
<text x="555.0" y="279.0" text-anchor="middle" font-size="13">oral histories, mythologies,</text>
<text x="555.0" y="296.0" text-anchor="middle" font-size="13">cosmologies, youth insights,</text>
<text x="555.0" y="313.0" text-anchor="middle" font-size="13">scholarship</text>
<rect x="742.0" y="237.0" width="246.0" height="92.0" rx="6" fill="#ffffff" stroke="#000" stroke-width="2.4"/>
<text x="865.0" y="279.0" text-anchor="middle" font-size="13" font-weight="bold">Permissions and restrictions</text>
<text x="865.0" y="296.0" text-anchor="middle" font-size="13">for each photograph</text>
<rect x="1048.5" y="237.0" width="253.0" height="92.0" rx="6" fill="#ffffff" stroke="#000" stroke-width="2.4"/>
<text x="1175.0" y="270.5" text-anchor="middle" font-size="13" font-weight="bold">Art direction</text>
<text x="1175.0" y="287.5" text-anchor="middle" font-size="13">visual language, creative</text>
<text x="1175.0" y="304.5" text-anchor="middle" font-size="13">directions, cultural safeguards</text>
<path d="M710.0,347.0 L710.0,389.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="70" y="391" width="1280" height="150" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1"/>
<text x="86" y="416" font-size="15" font-weight="bold">III · Translation into rules</text>
<text x="1334" y="416" font-size="13" font-style="italic" fill="#444" text-anchor="end">lead artist with the AI developer</text>
<rect x="101.5" y="431.0" width="225.0" height="92.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="108.5" y1="431.0" x2="108.5" y2="523.0" stroke="#111" stroke-width="1.2"/>
<line x1="319.5" y1="431.0" x2="319.5" y2="523.0" stroke="#111" stroke-width="1.2"/>
<text x="214.0" y="456.0" text-anchor="middle" font-size="13">Only photographs of people</text>
<text x="214.0" y="473.0" text-anchor="middle" font-size="13">enter the collage, as whole</text>
<text x="214.0" y="490.0" text-anchor="middle" font-size="13">cut-out figures, never</text>
<text x="214.0" y="507.0" text-anchor="middle" font-size="13">generated or altered</text>
<rect x="360.0" y="431.0" width="204.0" height="92.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="367.0" y1="431.0" x2="367.0" y2="523.0" stroke="#111" stroke-width="1.2"/>
<line x1="557.0" y1="431.0" x2="557.0" y2="523.0" stroke="#111" stroke-width="1.2"/>
<text x="462.0" y="456.0" text-anchor="middle" font-size="13">Photographs of water and</text>
<text x="462.0" y="473.0" text-anchor="middle" font-size="13">land inform newly made</text>
<text x="462.0" y="490.0" text-anchor="middle" font-size="13">material rather than</text>
<text x="462.0" y="507.0" text-anchor="middle" font-size="13">being pasted</text>
<rect x="604.5" y="431.0" width="211.0" height="92.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="611.5" y1="431.0" x2="611.5" y2="523.0" stroke="#111" stroke-width="1.2"/>
<line x1="808.5" y1="431.0" x2="808.5" y2="523.0" stroke="#111" stroke-width="1.2"/>
<text x="710.0" y="464.5" text-anchor="middle" font-size="13">Withheld knowledge stays</text>
<text x="710.0" y="481.5" text-anchor="middle" font-size="13">withheld; absence becomes</text>
<text x="710.0" y="498.5" text-anchor="middle" font-size="13">a compositional principle</text>
<rect x="859.5" y="431.0" width="197.0" height="92.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="866.5" y1="431.0" x2="866.5" y2="523.0" stroke="#111" stroke-width="1.2"/>
<line x1="1049.5" y1="431.0" x2="1049.5" y2="523.0" stroke="#111" stroke-width="1.2"/>
<text x="958.0" y="464.5" text-anchor="middle" font-size="13">Rooted in place, not in</text>
<text x="958.0" y="481.5" text-anchor="middle" font-size="13">generic “African” or</text>
<text x="958.0" y="498.5" text-anchor="middle" font-size="13">science-fiction futures</text>
<rect x="1104.0" y="431.0" width="204.0" height="92.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.2"/>
<line x1="1111.0" y1="431.0" x2="1111.0" y2="523.0" stroke="#111" stroke-width="1.2"/>
<line x1="1301.0" y1="431.0" x2="1301.0" y2="523.0" stroke="#111" stroke-width="1.2"/>
<text x="1206.0" y="464.5" text-anchor="middle" font-size="13">Visibly assembled:</text>
<text x="1206.0" y="481.5" text-anchor="middle" font-size="13">irregular cuts, overlaps</text>
<text x="1206.0" y="498.5" text-anchor="middle" font-size="13">and shifts of scale</text>
