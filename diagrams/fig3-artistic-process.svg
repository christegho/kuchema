<path d="M833.0,671.0 L987.8,671.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M1123.3,717.0 L1123.3,757.0 L710.0,757.0 L710.0,777.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="538.0" y="779.0" width="344.0" height="58.0" rx="0" fill="#ffffff" stroke="#111" stroke-width="1.0"/>
<text x="710.0" y="804.0" text-anchor="middle" font-size="13" font-weight="bold">Speculative collage with its provenance</text>
<text x="710.0" y="821.0" text-anchor="middle" font-size="13">photographs, passages and generated material</text>
<rect x="70" y="881" width="1280" height="150" fill="#f5f5f5" stroke="#a0a0a0" stroke-width="1"/>
<text x="86" y="906" font-size="15" font-weight="bold">V · Review and encounter</text>
<text x="1334" y="906" font-size="13" font-style="italic" fill="#444" text-anchor="end">visitors and the lead artist</text>
<rect x="244.5" y="921.0" width="311.0" height="92.0" rx="24" fill="#ffffff" stroke="#000" stroke-width="1.6"/>
<text x="400.0" y="946.0" text-anchor="middle" font-size="13" font-weight="bold">The Gathering</text>
<text x="400.0" y="963.0" text-anchor="middle" font-size="13">visitors interact with ceremonial</text>
<text x="400.0" y="980.0" text-anchor="middle" font-size="13">artefacts; each interaction starts</text>
<text x="400.0" y="997.0" text-anchor="middle" font-size="13">a new collage, projected and animated</text>
<rect x="890.0" y="921.0" width="260.0" height="92.0" rx="6" fill="#ffffff" stroke="#000" stroke-width="2.4"/>
<text x="1020.0" y="946.0" text-anchor="middle" font-size="13" font-weight="bold">Studio review</text>
<text x="1020.0" y="963.0" text-anchor="middle" font-size="13">the artist rearranges fragments,</text>
<text x="1020.0" y="980.0" text-anchor="middle" font-size="13">re-cuts failed parts and gives</text>
<text x="1020.0" y="997.0" text-anchor="middle" font-size="13">creative feedback</text>
<path d="M710.0,837.0 L710.0,859.0 L400.0,859.0 L400.0,919.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M710.0,837.0 L710.0,859.0 L1020.0,859.0 L1020.0,919.0" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M244.5,967.0 L40.0,967.0 L40.0,671.0 L157.7,671.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<path d="M1150.0,967.0 L1380.0,967.0 L1380.0,283.0 L1303.5,283.0" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text transform="translate(28,819.0) rotate(-90)" text-anchor="middle" font-size="13" font-style="italic">each interaction starts a new collage</text>
<text transform="translate(1400,625.0) rotate(-90)" text-anchor="middle" font-size="13" font-style="italic">creative feedback refines the direction and rules</text>
